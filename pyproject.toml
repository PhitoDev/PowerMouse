[project]
name = "PowerMouse"
version = "0.3.2"
description = "Hands-free mouse control using face tracking"
authors = [
    { name = "Ralph Dugue", email = "ralph@phito.dev" }
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">= 3.12, < 4.0.0"
dependencies = [
    "sqlalchemy >= 2.0.49",
    "opencv-python >= 4.13.0.92",
    "dearpygui >= 2.3",
    "mediapipe >= 0.10.33",
    "mouse >= 0.7.1",
    "numpy >= 2.4.4",
    "screeninfo >= 0.8.1",
    "platformdirs >= 4.3",
    "cv2-enumerate-cameras>=1.3.3",
    "pynput>=1.8.2",
    "vosk==0.3.44",
    "sounddevice==0.5.5",
]

[project.scripts]
powermouse = "powermouse.main:main"

[dependency-groups]
dev = ["pytest (>=9.0.3,<10.0.0)", "briefcase (>=0.4.1,<0.5.0)"]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Briefcase configuration
# ---------------------------------------------------------------------------

[tool.briefcase]
project_name = "PowerMouse"
bundle = "dev.phito"
url = "https://github.com/PhitoDev/PowerMouse"
author = "Ralph Dugue"
author_email = "ralph@phito.dev"

[tool.briefcase.app.powermouse]
formal_name = "PowerMouse"
description = "Hands-free mouse control using face tracking"
long_description = """PowerMouse is an accessibility-first desktop application that
provides hands-free mouse control via low-latency face tracking. It uses
OpenCV for video capture, MediaPipe for facial landmark detection, and
direct OS input APIs for minimal input latency."""
sources = ["src/powermouse"]

# Cross-platform permissions (mapped per-platform by Briefcase).
permission.camera = "PowerMouse needs webcam access to track your face for hands-free cursor control."
permission.microphone = "PowerMouse needs microphone access for offline voice clicking."

[tool.briefcase.app.powermouse.macOS]
# Floor set by dependency arm64 wheels: opencv-python and dearpygui ship
# macosx_13_0_arm64 wheels.
min_os_version = "13.0"
# mediapipe publishes arm64-only macOS wheels, so a universal (x86_64+arm64)
# build cannot resolve requirements.
universal_build = false
# Briefcase macOS apps cannot install sdist-only requirements (e.g. srt, a
# vosk dependency). CI pre-builds those wheels into ./wheels.
# Briefcase installs from the version floors above, not uv.lock; constrain it
# to the locked versions (CI exports constraints.txt from uv.lock) so the
# packaged app ships the same dependency versions that run from source.
# Unpinned installs shipped mediapipe 1.0/opencv 5.0, which crash at startup.
requirement_installer_args = ["--find-links", "wheels", "--constraint", "constraints.txt"]

[tool.briefcase.app.powermouse.windows]
requirement_installer_args = ["--constraint", "constraints.txt"]

[tool.briefcase.app.powermouse.linux]
# Linux system package backend. Override per-distro as needed.

[tool.briefcase.app.powermouse.linux.system.debian]
system_requires = []
system_runtime_requires = ["libportaudio2"]
