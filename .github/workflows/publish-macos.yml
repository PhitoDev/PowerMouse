name: Publish macOS
on:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    publish:
        runs-on: macos-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Install the latest version of uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
            - name: Import Apple Developer certificate
              env:
                  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
                  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
              run: |
                  KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
                  KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

                  echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security default-keychain -s "$KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security import $RUNNER_TEMP/certificate.p12 -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security list-keychain -d user -s "$KEYCHAIN_PATH"
            - name: Store notarization credentials
              env:
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
              run: |
                  xcrun notarytool store-credentials "briefcase-macOS-$APPLE_TEAM_ID" \
                      --apple-id "$APPLE_ID" \
                      --team-id "$APPLE_TEAM_ID" \
                      --password "$APPLE_APP_PASSWORD"
            - name: Pre-build wheels for sdist-only requirements
              # Briefcase cannot install sdist-only packages into macOS apps;
              # srt (a vosk dependency) only publishes an sdist.
              run: |
                  mkdir -p wheels
                  python3 -m pip wheel --no-deps srt -w wheels
            - name: Build artifacts
              env:
                  MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
              run: |
                  uv run briefcase create macOS
                  uv run briefcase build macOS
                  uv run briefcase package macOS --identity "$MACOS_SIGNING_IDENTITY"
            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(uv version --short)
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  gh release create "macOS-v$VERSION" ./dist/* --notes-file ./CHANGELOG.md
