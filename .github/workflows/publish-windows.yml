name: Publish Windows
on:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    publish:
        runs-on: windows-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Install the latest version of uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
            - name: Export locked requirement constraints
              # Briefcase installs requirements with pip, ignoring uv.lock;
              # this constraints file pins it to the locked versions.
              run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project -o constraints.txt
            - name: Install full CPython (tkinter source)
              id: full-python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14"
            - name: Build artifacts
              run: |
                  uv run briefcase create
                  # The embeddable Python that Briefcase bundles ships without
                  # tkinter, which the dwell palette needs; copy it in from the
                  # full CPython install (includes a Tcl-init smoke test).
                  $prefix = Split-Path -Parent "${{ steps.full-python.outputs.python-path }}"
                  .\scripts\windows_add_tkinter.ps1 -BundleRoot build\powermouse\windows\app -SourcePrefix $prefix
                  uv run briefcase build
                  uv run briefcase package
            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $VERSION = (&uv version --short).Trim()
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  gh release create "Windows-v$VERSION" ./dist/* --notes-file ./CHANGELOG.md
