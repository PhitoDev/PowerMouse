name: Tests

on:
    pull_request:
        branches:
            - main
            - develop
            - release

jobs:
    pytest:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install UV
              run: curl -LsSf https://astral.sh/uv/install.sh | sh
            - name: Install system dependencies for OpenCV / DearPyGui
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libgl1 \
                      libglib2.0-0 \
                      libsm6 \
                      libxext6 \
                      libxrender1 \
                      libxrandr2 \
                      libxinerama1 \
                      libxcursor1 \
                      libxi6 \
                      libgles2-mesa-dev
            - name: Sync project (with dev group)
              run: uv sync --group dev
            - name: Run tests
              run: uv run pytest -ra
