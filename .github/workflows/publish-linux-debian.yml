name: Publish Linux (Debian)
on:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install UV
              run: curl -LsSf https://astral.sh/uv/install.sh | sh
            - name: Build Artifacts
              run: |
                  uv run briefcase create linux system --target debian:bookworm
                  uv run briefcase build linux system --target debian:bookworm
                  uv run briefcase package linux system --target debian:bookworm
            - name: Tag release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(uv version --short)
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  if gh release view "Debian-v$VERSION" >/dev/null 2>&1; then
                      echo "Release Debian-v$VERSION already exists; skipping."
                  else
                      gh release create "Debian-v$VERSION" ./dist/* --notes-file ./CHANGELOG.md
                  fi
